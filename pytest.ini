[pytest]
# `pytest` on its own must do the right thing.
#
# Until now the whole suite was run as
#     pytest tests/ --ignore=tests/test_browser_integration.py
# and every reader had to know that, because those nine tests visit real URLs
# and `JarvisBrowser` launches `headless=False` on purpose (it is the
# "watch me browse" mode), so a plain run opened browser windows on the
# developer's desk and hung waiting for the network.
#
# A flag everyone must remember is a flag someone will forget. The tests are
# marked instead, and deselected here, so `pytest` runs the whole suite and
# touches neither the network nor the screen. To run them deliberately:
#
#     pytest -m browser
#
testpaths = tests
# The checkout's package first, so a worktree tests its own code.
pythonpath = .
addopts = -m "not browser and not page"
markers =
    browser: opens a real browser window and needs the network. Not run by default.
    page: builds the voice page and checks it in headless Chromium. Timing-dependent on a busy machine, so not run by default; run with `pytest -m page`.
    sips: calls macOS's real sips. Runs by default; tests/local-config.toml can skip it on one machine.
