# The environment every CI job starts from: Python with JARVIS installed in
# editable mode, Playwright's Chromium, and the frontend typechecked and built
# into the package (jarvis/web).
name: setup
description: Python, Node, Chromium and the built frontend
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: pyproject.toml

    - uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Python dependencies
      shell: bash
      run: pip install -r requirements.txt

    - name: Playwright Chromium
      shell: bash
      run: python -m playwright install chromium

    - name: Frontend dependencies
      shell: bash
      working-directory: frontend
      run: npm ci

    - name: Frontend typecheck
      shell: bash
      working-directory: frontend
      run: npx tsc --noEmit

    - name: Frontend build
      shell: bash
      working-directory: frontend
      run: npm run build
