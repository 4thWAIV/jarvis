name: language-kit

on:
  pull_request:
    paths: ["jarvis/language*.py", "jarvis/package*.py", "jarvis/work_packages.py", "jarvis/make_package.py", "tests/isolated_jarvis.py", "jarvis/workflow_report.py", "tests/test_language*.py", "tests/test_architecture*.py", "tests/architecture_author.py", "tests/test_voice_page_language_documents.py", "tests/test_voice_page_architecture_walkthrough.py", "tests/test_voice_page_kit_selectors.py", "tests/test_voice_page_architecture_view_set.py", "frontend/src/PackageBorder.tsx", "frontend/src/packageBridge.ts", "frontend/src/packages.ts", "jarvis/package_story.js", "tests/fixtures/architecture/**", "tests/test_story_questions.py", "frontend/src/PackageView.tsx", "frontend/src/style.css", "tests/test_voice_page_package_layout.py", "frontend/src/dashboard/markdown.ts", ".github/workflows/language-kit.yml"]
  workflow_dispatch:

jobs:
  runtime:
    # The repository already uses this macOS pool when arm64 capacity is short.
    runs-on: macos-15-intel
    strategy:
      matrix:
        node: [22, 23, 24]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Download the approved external kit asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 0.1.108421045-pre-release --repo 4thWAIV/agent-guard --pattern evolang-kit.zip --dir "$RUNNER_TEMP"
          # Refused unless it is byte for byte the pinned asset (language_kit.PINNED_DIGEST).
          echo "e0022da70300c875936a7b56a86ce03086015e3ec33bd49f259ada73185bf81c  $RUNNER_TEMP/evolang-kit.zip" | shasum -a 256 -c -
      - name: Upstream kit, canonical revisions and publication gates
        env:
          JARVIS_LANGUAGE_KIT_ASSET: ${{ runner.temp }}/evolang-kit.zip
        run: pytest tests/test_story_questions.py tests/test_architecture_approval.py tests/test_language_kit.py tests/test_language_kit_updates.py tests/test_language_documents.py tests/test_language_document_api.py tests/test_language_document_followup.py tests/test_language_projection.py tests/test_architecture_packages.py tests/test_architecture_end_to_end.py tests/test_architecture_targets_undeclared.py tests/test_architecture_view_set.py -v
      - name: Actual PackageView frame
        env:
          JARVIS_LANGUAGE_KIT_ASSET: ${{ runner.temp }}/evolang-kit.zip
        run: pytest -m page tests/test_voice_page_language_documents.py tests/test_voice_page_architecture_walkthrough.py tests/test_voice_page_package_layout.py tests/test_voice_page_kit_selectors.py tests/test_voice_page_architecture_view_set.py -v
