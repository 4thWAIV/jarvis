name: language-kit

on:
  pull_request:
    paths: ["jarvis/language*.py", "jarvis/package*.py", "jarvis/work_packages.py", "jarvis/make_package.py", "jarvis/decision_check.py", "jarvis/workflow_report.py", "tests/test_language*.py", "tests/test_architecture*.py", "tests/architecture_author.py", "tests/test_voice_page_language_documents.py", "tests/test_voice_page_architecture_walkthrough.py", "tests/test_story_questions.py", "frontend/src/PackageView.tsx", "frontend/src/dashboard/markdown.ts", ".github/workflows/language-kit.yml"]
  workflow_dispatch:

jobs:
  runtime:
    # The repository already uses this macOS pool when arm64 capacity is short.
    runs-on: macos-15-intel
    strategy:
      matrix:
        node: [22, 23, 24]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Download the approved external kit asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download 0.1.108172209-pre-release --repo 4thWAIV/agent-guard --pattern evolang-kit.zip --dir "$RUNNER_TEMP"
      - name: Upstream kit, canonical revisions and publication gates
        env:
          JARVIS_LANGUAGE_KIT_ASSET: ${{ runner.temp }}/evolang-kit.zip
        run: pytest tests/test_story_questions.py tests/test_language_kit.py tests/test_language_kit_updates.py tests/test_language_documents.py tests/test_language_document_api.py tests/test_language_document_followup.py tests/test_language_projection.py tests/test_architecture_packages.py tests/test_architecture_end_to_end.py -v
      - name: Actual PackageView frame
        env:
          JARVIS_LANGUAGE_KIT_ASSET: ${{ runner.temp }}/evolang-kit.zip
        run: pytest -m page tests/test_voice_page_language_documents.py tests/test_voice_page_architecture_walkthrough.py -v
