# Test JARVIS and package it: on every pull request, on every push to main,
# and by hand. Branch work runs once, through its pull request; a push to a
# branch without one runs nothing until the pull request is opened (or it is
# started by hand). A newer commit cancels a branch's older run; main's runs
# always finish, since the live checkout waits for main's CI to pass.
# Changes only under team_server/ or docs/ skip this workflow: the team
# server has its own (team-server.yml), and docs change no code.
#
# macOS, not Ubuntu, on purpose: JARVIS is a macOS-only project, and while
# every macOS-specific subprocess (osascript, screencapture, sips, claude) is
# faked at the seam in tests, the environment the suite was written against
# is a Mac. A green run here means what a green run on the author's machine
# means.
#
# The suite needs Python 3.11+, Node for the frontend build, and Playwright's
# Chromium. It does NOT need a Fish Audio key, a Claude login, or the
# network: the `browser` tests (a headful browser on live sites) are the one
# selection left out.
#
# Two test jobs on the same kind of macOS runner (the small runner job before
# them only chooses which, see below), each setting up on its own, side by side:
#   Test suite   the default selection (`pytest`), about 20 minutes
#   Page tests   the voice page in headless Chromium (`pytest -m page`), a job
#                of its own: it ran 41 minutes alone (run 42290500501), and
#                after the suite it took one job past its time limit. Its
#                Chromium has no WebGL except in the tests marked `webgl`
#                (tests/conftest.py, NO_3D_ARGS).
#   Timing       each pytest step writes --durations and a junit XML; each job
#                uploads them with the runner's size, failed runs included:
#                `test-timing` (unit.xml) and `test-timing-page` (page.xml,
#                a timed bare vite build and Chromium launch, and the runner's
#                load sampled every 30 s through the page step).
#   Package      on main and by hand only: the wheel and the sdist, installed
#                into a clean venv to prove they run, then uploaded as
#                `jarvis-dist`. A pull request does not need the package.

name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["team_server/**", "docs/**", ".github/workflows/team-server*.yml"]
  pull_request:
    paths-ignore: ["team_server/**", "docs/**", ".github/workflows/team-server*.yml"]
  workflow_dispatch:
    inputs:
      runner:
        description: "macOS runner: auto (by time of day), intel or apple"
        default: auto
        type: choice
        options: [auto, intel, apple]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Which macOS runner the tests wait for. GitHub's Apple Silicon runners go
  # short of capacity during the US day (runs cancelled without starting), so
  # the day (06:00-22:00 Pacific) uses Intel, about 1.6x slower but available,
  # and the night uses Apple Silicon. A run started by hand can choose.
  runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      label: ${{ steps.pick.outputs.label }}
    steps:
      - id: pick
        env:
          CHOICE: ${{ inputs.runner || 'auto' }}
        run: |
          hour=$(TZ=America/Los_Angeles date +%-H)
          case "$CHOICE" in
            intel) label=macos-15-intel ;;
            apple) label=macos-latest ;;
            *) if [ "$hour" -ge 6 ] && [ "$hour" -lt 22 ]; then label=macos-15-intel; else label=macos-latest; fi ;;
          esac
          echo "Pacific hour $hour, choice $CHOICE: $label"
          echo "label=$label" >> "$GITHUB_OUTPUT"

  test:
    needs: runner
    runs-on: ${{ needs.runner.outputs.label }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Runner size
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/test-timing"
          { sysctl -n hw.ncpu hw.memsize; sw_vers; } | tee "$RUNNER_TEMP/test-timing/runner-size.txt"
      - uses: ./.github/actions/setup
      - name: Reverse lookup of 127.0.0.1
        continue-on-error: true
        run: time python -c "import socket; socket.getfqdn('127.0.0.1')"
      - name: Test suite
        env:
          JARVIS_BRAIN_AUTOSTART: "0"
          JARVIS_ENGINE_AUTOSTART: "0"
        run: pytest -v -o faulthandler_timeout=300 -p no:cacheprovider --durations=50 --durations-min=0.5 --junitxml="$RUNNER_TEMP/test-timing/unit.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-timing
          path: ${{ runner.temp }}/test-timing/
          retention-days: 14
          if-no-files-found: warn
      - name: Build the wheel and the sdist
        if: github.event_name != 'pull_request'
        run: |
          pip install build
          python -m build
      - name: The wheel installs and runs
        if: github.event_name != 'pull_request'
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-check/bin/jarvis --help
          /tmp/wheel-check/bin/python -c "import jarvis.server, jarvis.data_paths as p; assert (p.FRONTEND_DIST / 'index.html').is_file(); assert not p.CHECKOUT"
          /tmp/wheel-check/bin/python - <<'PYTHON'
          import json, tempfile
          from pathlib import Path
          from jarvis import package_author, make_package, session_skill, decision_check, data_paths
          assert package_author.SKILL.is_file() and package_author.GUIDE.is_file()
          assert decision_check.built_page() == data_paths.FRONTEND_DIST
          assert 'human-package-author' in session_skill.render('human-package-author')
          with tempfile.TemporaryDirectory() as folder:
              root = Path(folder)
              source = root / 'content.json'
              source.write_text(json.dumps(make_package.PRESENTATION_EXAMPLE))
              assert make_package.make_deck(source, root / 'out').archive.is_file()
          PYTHON
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: jarvis-dist
          path: dist/
          retention-days: 30
          if-no-files-found: error

  # The page tests, beside the suite. self_update reads the whole workflow
  # run's conclusion, which passes only when every job here passes.
  page:
    needs: runner
    runs-on: ${{ needs.runner.outputs.label }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Runner size
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/test-timing"
          { sysctl -n hw.ncpu hw.memsize; sw_vers; } | tee "$RUNNER_TEMP/test-timing/runner-size.txt"
      - uses: ./.github/actions/setup
      - name: Time a bare vite build
        continue-on-error: true
        working-directory: frontend
        run: time npx vite build --outDir "$RUNNER_TEMP/vite-timing" --emptyOutDir --logLevel error
      - name: Time a bare Chromium launch
        continue-on-error: true
        run: time python -c "from playwright.sync_api import sync_playwright as s; p = s().start(); p.chromium.launch(headless=True).close(); p.stop()"
      - name: Page tests
        env:
          JARVIS_BRAIN_AUTOSTART: "0"
          JARVIS_ENGINE_AUTOSTART: "0"
        run: |
          # The runner's load every 30 s while the page tests run; it can never fail the step.
          load="$RUNNER_TEMP/test-timing/page-step-load.txt"
          ( while true; do
              { echo "=== $(date -u +%FT%TZ)"; vm_stat; top -l 1 | head -15; } >> "$load" 2>&1 || true
              sleep 30
            done ) &
          sampler=$!
          trap 'pkill -P "$sampler" 2>/dev/null || true; kill "$sampler" 2>/dev/null || true' EXIT
          pytest -m page -v -o faulthandler_timeout=300 -p no:cacheprovider --durations=50 --durations-min=0.5 --junitxml="$RUNNER_TEMP/test-timing/page.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-timing-page
          path: ${{ runner.temp }}/test-timing/
          retention-days: 14
          if-no-files-found: warn
