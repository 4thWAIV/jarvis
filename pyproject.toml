[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "A voice-first AI assistant for macOS that drives Claude Code"
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
    "websockets>=13.0",
    "playwright>=1.40.0",
    # Local speech recognition (transcriber.py). Pinned: the engine's model
    # configuration was measured against this version.
    "sherpa-onnx==2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
jarvis = "jarvis.server:main"

[tool.setuptools.packages.find]
include = ["jarvis", "jarvis.*"]

# Everything the code reads beside itself. web/ is the built voice page and
# dashboard (`npm run build` in frontend/ writes it).
[tool.setuptools.package-data]
jarvis = [
    ".env.example",
    "transcribeProtocol.json",
    "jarvis_home/*",
    "skills/**/*",
    "session_skills/**/*",
    "web/**/*",
]
