<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proposed isolated macOS browser-audio interception proof</title>
<style>/* Appearance, carried over from the design already agreed: paper ground, card sections,
   a filled mark for anything the page cannot make sense of, and a chip for a reference
   coloured by whether it resolves.

   A kind's colour is DERIVED from its position in the vocabulary, never written per kind.
   Five hand-written rules keyed on an id is how the earlier page ended up with a sixth
   actor drawing in no colour and saying nothing about it. */

:root{
  --paper:#f7f6f2; --card:#fff; --ink:#15192b; --soft:#454d63; --dim:#848b9c;
  --rule:#e2dfd6; --band:#f1efe8;
  --accent:#0d6e68; --accent-soft:#dff2ef; --accent-line:#8fc9c2;
  --warm:#9a5b00; --warm-soft:#fdf2dd; --warm-line:#e6bd72;
  --bad:#b3261e; --bad-soft:#fdecea; --bad-line:#eda39c;
  /* a boolean value, green for true and red for false */
  --yes:#1a7f37; --yes-soft:#e3f4e8; --yes-line:#9ad3ad;
  --no:#c02d1f; --no-soft:#fdeae7; --no-line:#f0ab9f;
  /* a regular expression, in a colour no reference chip uses */
  --expr:#c2410c; --expr-soft:#fdeee4; --expr-line:#f2b894;
  /* what a type says about itself: one colour each, so the two never read as the same chip */
  --abs:#3f36a8; --abs-soft:#eceafc; --abs-line:#b3abee;
  --prim:#8d2a63; --prim-soft:#fbe9f3; --prim-line:#e4a5c8;
  /* what one property of a type is to a reader, beyond the value it holds */
  --role:#1f5e9e; --role-soft:#e8f1fb; --role-line:#a7c8e8;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
 font:400 14px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
main{max-width:62rem;margin:0 auto;padding:40px 24px 90px}
code{font-family:var(--mono)}

/* ── the header ──────────────────────────────────────────────────────────── */
.d-top{margin-bottom:30px}
h1{font:600 31px/1.18 var(--sans);margin:0 0 9px;letter-spacing:-.015em}

/* WHAT NAMES THE FILE. A label and a breadcrumb, no box: the segments draw as the list they
   are rather than as a dotted string, and the label says which list it is. */
.d-ident{margin:0 0 14px;display:grid;gap:7px}
.d-ident-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
/* the label and a segment are the same box: one height, one padding, one radius, so the only
   thing that differs between them is what they say */
.d-ident-row>i,.d-path b{display:inline-flex;align-items:center;height:28px;padding:0 10px;
 border:1px solid transparent;border-radius:6px;flex:none}
.d-ident-row>i{font:700 9px/1 var(--sans);font-style:normal;letter-spacing:.15em;
 text-transform:uppercase;color:#fff;background:var(--accent);border-color:var(--accent)}
.d-path{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.d-path b{font:600 14px/1 var(--mono);color:var(--accent);background:var(--accent-soft);
 border-color:var(--accent-line)}
.d-path em{font:400 15px/1 var(--sans);font-style:normal;color:var(--accent);opacity:.55}
.d-path-none{font:italic 13px/1.5 var(--sans);color:var(--soft)}
/* the scopes a file brings into itself, one path each */
.d-imports{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.d-sub{font-size:14.5px;line-height:1.65;color:var(--soft);max-width:70ch;margin:0}
.d-foot{margin-top:44px;padding-top:16px;border-top:1px solid var(--rule);
 font-size:12.5px;color:var(--dim);max-width:76ch}
.d-foot p{margin:0 0 .45rem}.d-foot p:last-child{margin:0}
/* the fine print shows the colours it describes, drawn with the same rules as the page, and
   names each colour in the colour it names */
.d-legend{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;align-items:baseline;
 margin:14px 0 0}
.d-legend dt{display:flex;gap:5px;flex-wrap:wrap}
.d-legend dd{margin:0}
.d-legend .d-ref{font-size:11.5px;padding:2px 7px}
.d-legend .d-kind{background:var(--kind)}
.d-legend-keys{font:600 11.5px/1.5 var(--mono);color:var(--soft)}
.c-declared{color:var(--accent)}
.c-undeclared{color:var(--warm)}
@media (max-width:560px){ .d-legend{grid-template-columns:1fr;gap:4px 0}
  .d-legend dd{margin:0 0 10px} }

/* ── a declaration ───────────────────────────────────────────────────────── */
.d-decl{border:1px solid var(--rule);border-left:4px solid var(--kind,var(--rule));
 border-radius:11px;overflow:hidden;background:var(--card);margin:0 0 14px}
.d-decl-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap;
 padding:8px 14px;background:var(--band)}
.d-kind{font:700 9px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;
 color:#fff;background:var(--kind);padding:5px 8px;border-radius:4px;flex:none}
/* The name the thing is known by. It is what a reader is looking for, so it carries the head. */
.d-id{font:600 17.5px/1.3 var(--mono);letter-spacing:-.01em}
/* What a type says about itself: abstract, primitive. Drawn only when it is written true.
   Each word carries its own colour. A word added to the page before it is given one still
   draws, in ink on the card, so it is seen rather than lost against the band behind it. */
.d-said{font:700 8.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;
 color:var(--ink);background:var(--card);border:1px solid var(--soft);
 border-radius:4px;padding:4px 7px;flex:none}
.s-abstract{color:var(--abs);background:var(--abs-soft);border-color:var(--abs-line)}
.s-primitive{color:var(--prim);background:var(--prim-soft);border-color:var(--prim-line)}
/* that a property may be left out. Dashed, because the thing it marks may not be there at all. */
.s-optional{color:var(--dim);background:var(--band);border:1px dashed var(--rule);margin-left:8px}
.d-count{font:700 9px/1 var(--mono);color:var(--soft);background:var(--card);
 border:1px solid var(--rule);padding:4px 7px;border-radius:4px;margin-left:auto;flex:none}

.d-is{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;
 padding:7px 14px;border-top:1px solid var(--rule)}
.d-is>i{font:700 9px/1.6 var(--sans);font-style:normal;letter-spacing:.14em;
 text-transform:uppercase;color:var(--dim);flex:none}
.d-is>span{display:flex;gap:6px;flex-wrap:wrap}
/* `is` drawn on the declaration's own line, so a declaration costs one line and not two. It is
   part of that line rather than a row of its own, so it keeps none of a row's padding or rule. */
.d-is-head{gap:7px;margin:0;padding:0;border-top:0}

/* ── a reference, coloured by whether it resolves ────────────────────────── */
.d-ref{display:inline-flex;align-items:baseline;gap:5px;border-radius:5px;padding:3px 8px;
 font:600 12px/1.4 var(--mono);border:1px solid transparent}
.d-ref i{font:700 8px/1 var(--sans);font-style:normal;letter-spacing:.1em;
 text-transform:uppercase;opacity:.75}
/* the shape. It carries the same meaning the colour does, for anyone the colour excludes. */
.d-ref b{font:400 11px/1 var(--sans);flex:none;opacity:.9}
.r-declared{color:var(--accent);background:var(--accent-soft);border-color:var(--accent-line)}
.r-imported{color:var(--accent);background:var(--card);border-color:var(--accent-line)}
.r-undeclared{color:var(--warm);background:var(--warm-soft);border-color:var(--warm-line)}

/* ── the word that says a declaration's implementation lives outside the language ───────── */
.d-extern{display:inline-flex;align-items:baseline;border-radius:5px;padding:3px 8px;
 font:700 9px/1.6 var(--sans);letter-spacing:.14em;text-transform:uppercase;
 color:var(--soft);background:var(--band);border:1px dashed var(--rule);flex:none}

/* ── a value written in the file: what an enum's id stands for, and what a property always
      holds. A value, not a type, so it carries no reference shape ─────────────────────────── */
.d-val{display:inline-flex;align-items:baseline;border-radius:5px;padding:3px 8px;
 font:600 12px/1.4 var(--mono);color:var(--soft);background:var(--band);
 border:1px solid var(--rule)}
/* a boolean, in the colour it reads as */
.v-true{color:var(--yes);background:var(--yes-soft);border-color:var(--yes-line)}
.v-false{color:var(--no);background:var(--no-soft);border-color:var(--no-line)}
/* a regular expression, between the slashes it is written between in most languages */
.v-expr{color:var(--expr);background:var(--expr-soft);border-color:var(--expr-line)}
/* A run of characters its type constrains in no way and no enum lists: matched against nothing,
   so it is read rather than recognised. It draws as the sentence it is — the page's own font, no
   ground, no border, and no equals sign standing in the middle of it. */
.d-val.v-text{display:inline;background:transparent;border-color:transparent;padding:0;
 font:400 13.5px/1.62 var(--sans);color:var(--ink)}
/* the marks around a value rather than the value itself: the equals sign every value follows,
   and the slashes a regular expression sits between */
.d-val i{font-style:normal;opacity:.5;padding:0 1px}
.d-val .v-eq{padding:0 4px 0 0}

/* A value of a type with properties: its named parts. The parts are chips, so the value holding
   them carries none of a chip's own ground, border or padding, and each part keeps its own. */
.d-val.v-parts{background:transparent;border-color:transparent;padding:0}
.d-parts{display:inline-flex;align-items:baseline;flex-wrap:wrap;gap:5px 9px}
.d-part{display:inline-flex;align-items:baseline;gap:5px}
.d-part>i{font:600 10.5px/1.4 var(--sans);font-style:normal;letter-spacing:.07em;
 text-transform:uppercase;color:var(--dim);opacity:1;padding:0}

/* ── what a declaration carries of its own ─────────────────────────────────
   A declaration holding one value of its own type IS that value, so the keyword it is written
   under is the language's word and never the reader's: the value draws as the body of the card
   rather than as a row named after the keyword. Its parts take one row each — the part's name in
   a quiet column, what it holds beside it — so a part holding a sentence and a part holding many
   of a thing each have the width they need. */
.d-own{padding:3px 14px 10px;border-top:1px solid var(--rule)}
.d-own>.d-val.v-parts{display:block}
.d-own .d-parts{display:block}
.d-own .d-part{display:grid;grid-template-columns:minmax(4.5rem,7rem) minmax(0,1fr);
 gap:0 16px;align-items:baseline;padding:7px 0}
.d-own .d-part+.d-part{border-top:1px solid var(--band)}
.d-own .d-part>i{padding-top:3px}
/* A token is as wide as the word it holds; a sentence takes the column and wraps inside it. */
.d-own .d-part>.d-val{min-width:0;max-width:74ch;justify-self:start}
.d-own .d-part>.d-val.v-text,.d-own .d-part>.d-val.v-table{justify-self:stretch}

/* ── the prose a thing carries: one line saying what it is, then the explanation ─────────── */
.d-prose{padding:1px 14px 11px;max-width:74ch}
.d-prose b{display:block;font:600 12.75px/1.5 var(--sans);color:var(--ink)}
.d-prose p{margin:4px 0 0;font:13px/1.62 var(--sans);color:var(--soft)}
/* under a property or a value, lined up with the column that says what that name holds */
.d-prose-row{display:grid;grid-template-columns:minmax(8rem,14rem) 1fr;gap:0 12px;
 padding:0 14px 10px;max-width:none}
.d-prose-row>*{grid-column:2;max-width:74ch}

/* ── the properties ──────────────────────────────────────────────────────── */
.d-prow{display:grid;grid-template-columns:minmax(8rem,14rem) 1fr;gap:12px;
 align-items:baseline;padding:7px 14px;border-top:1px solid var(--rule)}
.d-pname{font:600 12.75px/1.4 var(--mono)}
.d-pfrom{font:italic 11.5px/1.45 var(--sans);color:var(--dim);margin-left:6px}
/* A type written out rather than named: the word for one of its own properties, as in
   "array of name". Low contrast, because the two type references either side carry the meaning. */
.d-pof{font:600 9px/1.6 var(--sans);font-style:normal;letter-spacing:.14em;
 text-transform:uppercase;color:var(--dim);margin:0 7px}
/* the value a property always holds, drawn after the type it holds it as */
.d-pval{margin-left:8px}
.d-nothing{padding:26px 0;font:italic 14px/1.6 var(--sans);color:var(--dim)}

/* ── a section of the file, headed by the top-level keyword that names it ─── */
.d-section{margin:0 0 28px}
.d-section-name{font:700 10px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;
 color:var(--soft);margin:0 0 13px;padding:0 0 10px;border-bottom:1px solid var(--rule)}

/* ── THE ERROR CONTROL. What draws when nothing describes the data. ──────── */
.d-err{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;
 background:var(--bad-soft);border:1px solid var(--bad-line);border-left-width:3px;
 border-radius:6px;padding:6px 10px;margin:7px 14px}
.d-err>em{font:800 9px/1 var(--sans);font-style:normal;letter-spacing:.13em;
 text-transform:uppercase;color:#fff;background:var(--bad);padding:5px 7px;
 border-radius:3px;flex:none}
.d-err>b{font:600 12.5px/1.5 var(--sans);color:var(--bad);flex:1 1 18rem}
.d-err>code{font-size:11px;color:var(--bad);background:var(--card);
 border:1px solid var(--bad-line);padding:3px 6px;border-radius:3px;overflow-wrap:anywhere}
.d-err-loose{margin:8px 0}

@media (max-width:560px){
  main{padding:28px 16px 64px}
  h1{font-size:25px}
  .d-prow{grid-template-columns:1fr;gap:3px}
  .d-count{margin-left:0}
}

/* A value written out as YAML sits inside a value, so the value carries none of a chip's ground
   or border and the block keeps its own. */
.d-val.v-written{background:transparent;border-color:transparent;padding:0;display:block}
.d-val.v-written pre.y{margin:2px 0 0}

/* Several of one shape: a table saying each column's name once. It sits inside a value, so it
   carries none of a chip's ground or border and lets the cells keep their own. */
.d-val.v-table{background:transparent;border-color:transparent;padding:0;display:block}
.d-mark{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 5px;
        border-radius:6px;background:color-mix(in oklch,var(--kind) 12%,transparent);
        color:var(--kind);font:600 12px/1 var(--mono)}
.v-mark{display:inline-block;margin-right:5px;padding:0 4px;border-radius:5px;
        background:var(--band);color:var(--soft);font:600 11px/1.5 var(--mono)}
.v-many{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:baseline}
.d-rungs{list-style:none;margin:2px 0 0;padding:0}
.d-rung{display:flex;align-items:baseline;gap:10px;padding:3px 0 3px 10px;
        margin-left:calc(var(--step) * 18px);border-left:3px solid var(--kind,var(--rule))}
.d-rung .rung-word{font:600 10.5px/1.4 var(--sans);letter-spacing:.07em;text-transform:uppercase;
                   color:var(--kind,var(--dim));min-width:9ch}
.d-rung .gone{color:var(--dim)}
.d-table{border-collapse:collapse;margin:2px 0 0}
.d-table th{font:600 10.5px/1.4 var(--sans);letter-spacing:.07em;text-transform:uppercase;
 color:var(--dim);text-align:left;padding:0 10px 3px 0;white-space:nowrap}
.d-table td{padding:1px 10px 1px 0;vertical-align:baseline}
.d-table td:last-child,.d-table th:last-child{padding-right:0}
.d-table .t-none{color:var(--dim);opacity:.6;font-style:normal}
/* A column says what the cell is, so the equals sign inside it would say it a second time. */
.d-table .v-eq{display:none}
/* Several of one shape inside a declaration's own value is a list of that thing, read down the
   page: the columns name themselves once at the top and every row is parted from the next. */
.d-own .d-table{width:100%;margin:4px 0 2px}
.d-own .d-table th{padding:0 18px 7px 0;border-bottom:1px solid var(--rule)}
.d-own .d-table td{padding:8px 18px 8px 0;border-bottom:1px solid var(--band);vertical-align:top}
.d-own .d-table tr:last-child td{border-bottom:0}
.d-own .d-table td .d-val{max-width:62ch}

/* Where a highlight points. The mark is around the node, so the node draws as it always does and
   nothing it holds knows it was marked. */
.d-marked{position:relative;border-left:3px solid var(--mark,oklch(72% 0.16 85));
 background:color-mix(in oklch, var(--mark,oklch(72% 0.16 85)) 7%, transparent);
 border-radius:3px;padding:2px 6px 2px 9px;margin:2px 0}
.d-marked>.d-note{font:400 12px/1.5 var(--sans);color:var(--ink);margin:3px 0 1px;
 padding-left:1px;opacity:.9}
/* One member of a table, where a highlight points at the member rather than at the whole list. */
.d-table tr.r-marked>td{background:color-mix(in oklch, var(--mark,oklch(72% 0.16 85)) 10%,
 transparent)}

/* ── WHAT THE CHECKER FOUND, SAID ON THE DOCUMENT ─────────────────────────────
   Each finding is drawn where it sits, as a mark in the colour of the list it came from, and the
   band says the same things once at the top of the page, above everything they are about. A
   document nothing was found in draws no band: the page spends no height saying a thing is
   absent. */
.d-found{border:1px solid var(--rule);border-left:4px solid var(--warm);border-radius:9px;
 background:var(--card);padding:11px 14px 13px;margin:0 0 26px}
.d-found.has-problem{border-left-color:var(--bad)}
.d-found-head{font:700 10px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;
 color:var(--soft);margin:0 0 11px}
.d-found ul{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.d-found li{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
/* which list it came from, spelled out, because the colour alone leaves some readers out */
.f-what{font:700 8.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;
 border-radius:4px;padding:4px 7px;flex:none}
.f-problem{color:var(--bad);background:var(--bad-soft);border:1px solid var(--bad-line)}
.f-blocker{color:var(--soft);background:var(--band);border:1px solid var(--rule)}
.f-at{font:600 11.5px/1.5 var(--mono);color:var(--accent);overflow-wrap:anywhere}
/* one naming no node has nowhere to point, so it is not a link and does not read as one */
.f-nowhere{color:var(--soft)}
.f-says{font:400 13px/1.5 var(--sans);color:var(--ink)}

/* The colour of a mark is the worst thing said at it. One carrying only a highlight keeps the
   colour a highlight has always drawn in. */
.m-problem{--mark:var(--bad)}
.m-blocker{--mark:var(--dim)}

/* What is said about one member of a table, under the row it is about. A row cannot be wrapped
   the way every other node is, so the mark is the row itself and this is where its words go. */
.d-table tr.r-note>td{padding-top:0}
.d-table tr.r-note .d-note{font:400 12px/1.5 var(--sans);color:var(--ink);margin:1px 0 5px;
 opacity:.9}

/* A reserved state where a value goes: the word the document writes, dashed, for the same reason
   the word saying a property may be left out is dashed — the thing it marks is not there. One
   that is reported is amber; one that says an absence was decided is quiet. */
.d-val.v-reserved{border-style:dashed}
.d-val.v-pending{color:var(--warm);background:var(--warm-soft);border-color:var(--warm-line)}
.d-val.v-none{color:var(--dim);background:var(--band);border-color:var(--rule)}
.m-pending{--mark:var(--warm)}
.f-pending{color:var(--warm);background:var(--warm-soft);border:1px solid var(--warm-line)}
/* what a property takes in place of a value, said on the property itself */
.s-accepts{color:var(--warm);background:var(--warm-soft);border:1px dashed var(--warm-line);
 margin-left:8px;text-transform:none;letter-spacing:.04em;font-family:var(--mono)}
/* What one property of a type is to a reader, beyond the value it holds. Solid, because what it
   marks is there: the role says how the value is read, not whether it was written. */
.s-role{color:var(--role);background:var(--role-soft);border:1px solid var(--role-line);
 margin-left:8px;text-transform:none;letter-spacing:.04em;font-family:var(--mono)}

/* The name a vocabulary gives the word a value names, beside the id it is written as. The id
   carries the weight, because it is what the document says; the name is what it is called. */
.d-val .v-name{font:600 11.5px/1.4 var(--sans);margin-left:7px;opacity:.72}
/* what a highlight asks, which is allowed on a page only where it needs reading */
.f-highlight{color:var(--warm);background:var(--card);border:1px solid var(--warm-line)}

/* The colours a document written out as YAML is drawn in.
 *
 * One file, used by the rendered pages and by any page written by hand, so an example never
 * reads one way in one place and another way somewhere else. What each class means is decided
 * in syntax.ts, from the vocabulary; this file only says what each one looks like.
 *
 * Every colour falls back to its own value, so a page that carries none of the page tokens still
 * draws the example the same way.
 *
 * Light, like every page here. */

pre.y {
  font: 400 13px/1.62 var(--mono, ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace);
  background: var(--band, #f1efe8);
  color: var(--ink, #15192b);
  border: 1px solid var(--rule, #e2dfd6);
  border-radius: 8px;
  padding: 12px 14px;
  margin: 0;
  overflow-x: auto;
  min-width: 0;
  tab-size: 2;
}

/* A comment: what a person wrote beside the language, not the language. */
.y-note {
  color: var(--dim, #848b9c);
  font-style: italic;
}

/* The punctuation YAML is written with. It holds the shape and says nothing itself. */
.y-mark {
  color: var(--dim, #848b9c);
}

/* The word naming what a declaration is, in the colour the vocabulary gives that kind. */
.y-kind {
  color: var(--kind, var(--accent, #0d6e68));
  font-weight: 700;
}

/* A keyword the language declares. */
.y-word {
  color: var(--accent, #0d6e68);
  font-weight: 600;
}

/* A name the document gives: what it declares, and what it calls its own properties. */
.y-name {
  color: var(--ink, #15192b);
  font-weight: 600;
}

/* A word pointing at a declared type. */
.y-ref {
  color: var(--accent, #0d6e68);
  background: var(--accent-soft, #dff2ef);
  border-radius: 3px;
  padding: 0 3px;
}

/* A word the keyword's own type lists as one of its values. */
.y-member {
  color: var(--prim, #8d2a63);
  background: var(--prim-soft, #fbe9f3);
  border-radius: 3px;
  padding: 0 3px;
}

/* A true and a false, in the colours they read as. */
.y-true {
  color: var(--yes, #1a7f37);
  font-weight: 600;
}

.y-false {
  color: var(--no, #c02d1f);
  font-weight: 600;
}

.y-number {
  color: var(--abs, #3f36a8);
}

/* A regular expression, in the colour no reference uses. */
.y-expr {
  color: var(--expr, #c2410c);
}

/* Text: a title, prose, anything whose type is a string. Quiet, because it is most of a file. */
.y-text {
  color: var(--soft, #454d63);
}

/* Anything the vocabulary does not account for. Loud on purpose, and underlined as well as
   coloured, so it is seen by a reader the colour leaves out. */
.y-unknown {
  color: var(--bad, #b3261e);
  background: var(--bad-soft, #fdecea);
  border-radius: 3px;
  padding: 0 3px;
  text-decoration: underline wavy var(--bad, #b3261e);
  text-underline-offset: 3px;
}

/* A word standing where a value goes, saying the value is not there. Dashed underneath, like the
   edge the page draws round the same word, because the thing it marks is not there. */
.y-reserved {
  color: var(--warm, #9a5b00);
  text-decoration: underline dashed var(--warm-line, #e6bd72);
  text-underline-offset: 3px;
}
</style>

scription":"Every member of an element is of exactly one kind."},"scope":["arch"]},"kinds":{"kind":"enum","body":{"id":"kinds","is":"kind","title":"Every kind of member, in reading order.","values":[{"id":"method","title":"A callable on a type. Carries a signature.","value":{"mark":"()","example":"IGuard.PrecheckAsync","name":"Method"}},{"id":"constructor","title":"How an instance comes into being.","value":{"mark":"new","example":"FileGuard(FileGuardConfiguration)","name":"Constructor"}},{"id":"property","title":"Accessed as data, computed as behaviour.","value":{"mark":"get/set","example":"Verdict.Kind","name":"Property"}},{"id":"field","title":"Stored data on a type.","value":{"mark":"▪","example":"FileGuard._defaultVerifier","name":"Field"}},{"id":"value","title":"One of the closed set an enum declares. Not stored data on a type.","value":{"mark":"◆","example":"VerdictKind.Deny","name":"Value"}}]},"scope":["arch"]},"placename":{"kind":"entity","body":{"id":"placename","is":"string","title":"The name of a place, written in parts separated by dots.","description":"A package, an assembly and a namespace are all named this way. MetaLang's `name` would refuse both the dot an assembly carries and the hyphen a package carries.\n","constraints":[{"pattern":{"value":"[A-Za-z_][A-Za-z0-9_-]*(\\.[A-Za-z_][A-Za-z0-9_-]*)*"}}]},"scope":["arch"]},"place":{"kind":"entity","body":{"id":"place","is":"word","title":"One kind of place an element can sit in.","description":"Each one is a level of its own: a package is shipped, an assembly is loaded, a namespace groups names inside one. A language that has no word for a level has none of that kind.\n"},"scope":["arch"]},"places":{"kind":"enum","body":{"id":"places","is":"place","title":"Every kind of place, widest first.","values":[{"id":"package","title":"What is shipped and depended on as one thing.","value":{"mark":"▣","example":"AgentGuard.Engine","name":"Package"}},{"id":"assembly","title":"What is compiled and loaded as one thing.","value":{"mark":"▤","example":"AgentGuard.Abstractions","name":"Assembly"}},{"id":"namespace","title":"What names are grouped under inside an assembly.","value":{"mark":"::","example":"AgentGuard.Abstractions.Contracts","name":"Namespace"}}]},"scope":["arch"]},"relation":{"kind":"entity","body":{"id":"relation","is":"word","title":"One way an element can stand to another element.","description":"Each one is a different question about the same two things, so a document that says which one it means says what the relation is rather than that there is one.\n"},"scope":["arch"]},"relations":{"kind":"enum","body":{"id":"relations","is":"relation","title":"Every way one element can stand to another, in reading order.","values":[{"id":"implements","title":"It satisfies the whole of the surface the other declares.","value":{"mark":"⊢","example":"FileGuard implements IGuard","name":"Implements"}},{"id":"answers","title":"It gives the other one back to whoever called it.","value":{"mark":"→","example":"IGuard answers with a Verdict","name":"Answers"}},{"id":"holds","title":"It carries the other one as part of itself.","value":{"mark":"⊂","example":"Verdict holds a VerdictKind","name":"Holds"}}]},"scope":["arch"]},"reach":{"kind":"entity","body":{"id":"reach","is":"word","standing":"approved","origin":"Tim, through his jarvis session, 27 October 2026","title":"One answer to who can see a thing.","description":"Written on an element and on each of its members, because a public member of an internal class is not reachable and the two answers are not the same answer."},"scope":["arch"]},"reaches":{"kind":"enum","body":{"id":"reaches","is":"reach","title":"Every answer to who can see a thing, widest first.","values":[{"id":"public","title":"Visible to anything that can see the assembly it lives in.","value":{"mark":"◎","example":"IGuard","name":"Public"}},{"id":"internal","title":"Visible inside its own assembly and nowhere else.","value":{"mark":"◐","example":"SystemServices","name":"Internal"}},{"id":"private","title":"Visible only inside the type that declares it.","value":{"mark":"●","example":"FileGuard's constructor","name":"Private"}}]},"scope":["arch"]},"exactness":{"kind":"entity","body":{"id":"exactness","is":"word","standing":"approved","origin":"Tim, through his jarvis session, 27 October 2026","title":"How exactly an element pins the types of its members.","description":"Nearly everything is loose. Exact is for a thing whose bytes are laid out, where the width of each member is part of what it is."},"scope":["arch"]},"exactnesses":{"kind":"enum","body":{"id":"exactnesses","is":"exactness","title":"Every answer to how exactly an element pins its types.","values":[{"id":"loose","title":"Types are named as the language gives them, which is nearly always right.","value":{"mark":"≈","example":"Verdict","name":"Loose"}},{"id":"exact","title":"Every member names a built-in type of determined size, so a byte layout is drawn.","value":{"mark":"▦","example":"CredUiInfo","name":"Exact"}}]},"scope":["arch"]},"builtin":{"kind":"entity","body":{"id":"builtin","is":"word","standing":"approved","origin":"Tim, through his jarvis session, 27 October 2026","title":"One built-in type a member may carry where its element is exact, that MetaLang does not already name.","description":"Common to C#, Python, Rust and TypeScript. The mark is shared by family rather than one per word, because fifteen glyphs would be noise where four families read at a glance. MetaLang already declares `boolean` and `uuid`, and every document written in this language brings MetaLang in, so a member carrying one of those names it rather than naming a second word for the same thing. The width is a `range`, which is MetaLang's own word for a lowest and a highest value, so a page works out a byte layout from the document rather than from a sentence.\n","properties":{"bounds":{"is":"range","accepts":["none"],"title":"The lowest and the highest value it holds, where it holds a number."}}},"scope":["arch"]},"builtins":{"kind":"enum","body":{"id":"builtins","is":"builtin","title":"Every built-in type an exact element may use beside the ones MetaLang already names.","values":[{"id":"int8","title":"A signed whole number, one byte.","value":{"bounds":{"minimum":-128,"maximum":127},"mark":"#","example":"none","name":"int8"}},{"id":"int16","title":"A signed whole number, two bytes.","value":{"bounds":{"minimum":-32768,"maximum":32767},"mark":"#","example":"none","name":"int16"}},{"id":"int32","title":"A signed whole number, four bytes.","value":{"bounds":{"minimum":-2147483648,"maximum":2147483647},"mark":"#","example":"CredUiInfo.Size","name":"int32"}},{"id":"int64","title":"A signed whole number, eight bytes.","value":{"bounds":{"minimum":-9223372036854776000,"maximum":9223372036854776000},"mark":"#","example":"none","name":"int64"}},{"id":"uint8","title":"An unsigned whole number, one byte.","value":{"bounds":{"minimum":0,"maximum":255},"mark":"#","example":"none","name":"uint8"}},{"id":"uint16","title":"An unsigned whole number, two bytes.","value":{"bounds":{"minimum":0,"maximum":65535},"mark":"#","example":"none","name":"uint16"}},{"id":"uint32","title":"An unsigned whole number, four bytes.","value":{"bounds":{"minimum":0,"maximum":4294967295},"mark":"#","example":"none","name":"uint32"}},{"id":"uint64","title":"An unsigned whole number, eight bytes.","value":{"bounds":{"minimum":0,"maximum":18446744073709552000},"mark":"#","example":"none","name":"uint64"}},{"id":"fp32","title":"A number with a fraction, four bytes.","value":{"bounds":"none","mark":"~","example":"none","name":"fp32"}},{"id":"fp64","title":"A number with a fraction, eight bytes.","value":{"bounds":"none","mark":"~","example":"none","name":"fp64"}},{"id":"decimal128","title":"A number with a fraction and no rounding error, sixteen bytes.","value":{"bounds":"none","mark":"~","example":"none","name":"decimal128"}},{"id":"bytes","title":"Raw bytes of a stated length.","value":{"bounds":"none","mark":"▭","example":"none","name":"bytes"}},{"id":"utf8","title":"Text, held as UTF-8.","value":{"bounds":"none","mark":"¶","example":"none","name":"utf8"}},{"id":"instant","title":"A point in time.","value":{"bounds":"none","mark":"◷","example":"none","name":"instant"}},{"id":"duration","title":"A length of time.","value":{"bounds":"none","mark":"◷","example":"none","name":"duration"}}]},"scope":["arch"]},"grouping":{"kind":"entity","body":{"id":"grouping","is":"word","standing":"approved","origin":"Tim, through his jarvis session, 27 October 2026","title":"One way of gathering elements that cuts across where they sit.","description":"An element says which group it is in, on the element. A grouping never holds a list of its members, so the answer is always written next to the thing it is true of. A layer is not one of these: the layers of a project are its assemblies, which an element already writes under `sits`.\n"},"scope":["arch"]},"groupings":{"kind":"enum","body":{"id":"groupings","is":"grouping","title":"Every way of grouping elements, beside the places they sit in.","values":[{"id":"concept","title":"A subject area, gathering elements wherever they sit.","value":{"mark":"✳","example":"presence, setup, context, guard","name":"Concept"}},{"id":"job","title":"What a type is for, as distinct from what it is.","value":{"mark":"⊙","example":"service, owner, port, door, container","name":"Job"}}]},"scope":["arch"]},"member":{"kind":"entity","body":{"id":"member","is":"object","title":"One named piece of an element.","description":"Its name is written here, because a member is not declared and has no id.","properties":{"name":{"is":"name","role":"name","title":"The name it is known by."},"kind":{"is":"kinds","role":"kind","title":"Which of the five kinds of member it is."},"reach":{"is":"reaches","accepts":["pending"],"title":"Who can see it. A public member of an internal class is not reachable, so the element's answer is not this one."},"type":{"is":"builtins","accepts":["none","pending"],"title":"The built-in type it carries where its element is exact.","description":"`none` where its element is loose, which is nearly always, because a loose element names its types as the language it is written in gives them. Where its element is exact it may not say `none`, which the element says for itself as a constraint rather than here.\n"},"does":{"is":"string","role":"prose","title":"One line saying what it does."}}},"scope":["arch"]},"element":{"kind":"entity","body":{"id":"element","is":"object","title":"One named piece of an architecture.","description":"The name it is known by is the name it is declared under. An element whose bytes are laid out has to say what each of its members carries, and one whose types are named as the language gives them does not; that is written below rather than said here.\n","constraints":[{"when":{"at":"exactness","holds":["exact"],"then":{"never":{"at":"members.type","carries":["none"]}}}}],"properties":{"form":{"is":"forms","role":"kind","title":"Which of the six forms it takes."},"does":{"is":"string","role":"prose","title":"One line saying what it does."},"reach":{"is":"reaches","accepts":["pending"],"title":"Who can see it."},"exactness":{"is":"exactnesses","accepts":["pending"],"title":"How exactly it pins the types of its members."},"groups":{"map":{"by":"groupings","of":"string","accepts":["none"]},"accepts":["none","pending"],"title":"Which group it is in, for each way of grouping."},"members":{"list":{"of":"member"},"accepts":["none","pending"],"title":"The members it has, in the order the source declares them."},"sits":{"map":{"by":"places","of":"placename","accepts":["none"]},"accepts":["none","pending"],"title":"Where it sits, one line for each kind of place."},"relates":{"map":{"by":"relations","of":{"list":{"of":{"link":{"to":"element"}}}},"accepts":["none"]},"accepts":["none","pending"],"title":"What it stands to, one line for each way one element can stand to another."}}},"scope":["arch"]}}},"doc":{"scope":["denice","audio","interceptionproof"],"language":"arch","import":[["metalang"]],"title":"Proposed isolated macOS browser-audio interception proof","description":"A compile-selected diagnostic in the existing Denice.CrossPlatform.MacOS project, behind the DeniceAudioInterceptionProof property, run from a separate bundle. Nothing here is implemented or demonstrated. It redirects only the Chromium Embedded Framework image's AudioToolbox output calls and Chromium's AVSpeechSynthesizer speech into one proof mixer, which plays the mixed output through DENICE's own AudioToolbox calls and gives the same mixed samples to the existing recorder. Normal builds contain none of it, and no public interface changes.\n","declare":[{"constant":{"id":"AudioUnitRedirectionProof","is":"element","value":{"form":"class","does":"Proposed. Replaces the CEF framework image's GOT entries for its AudioToolbox output calls before CefRuntime.Initialize, so Chromium's HAL output units are configured but never started and their render callbacks go to the proof mixer, for default-device and explicitly selected devices alike.","reach":"internal","exactness":"loose","groups":{"concept":"audio","job":"service"},"members":[{"name":"Install","kind":"method","reach":"internal","type":"none","does":"Locates the loaded Chromium Embedded Framework image, maps its __DATA_CONST __got slots to symbol names, saves the originals and writes the replacements, once, while no CEF audio unit exists."},{"name":"ReplaceAudioComponentInstanceNew","kind":"method","reach":"private","type":"none","does":"Calls the original and records the new instance as a CEF output unit when the component is a HAL output unit."},{"name":"ReplaceAudioUnitSetProperty","kind":"method","reach":"private","type":"none","does":"For CEF output units keeps the render callback and stream format instead of installing them on the real unit, and forwards every other property, including the selected device, to the original."},{"name":"ReplaceAudioOutputUnitStart","kind":"method","reach":"private","type":"none","does":"Registers the stream with the proof mixer and never starts the hardware unit, so Chromium's own output never reaches a device."},{"name":"ReplaceAudioOutputUnitStop","kind":"method","reach":"private","type":"none","does":"Returns only after the stream has left the mixer and any render cycle that might be inside its callback has finished, matching Core Audio's promise that no callback runs after a stop returns."},{"name":"ReplaceAudioComponentInstanceDispose","kind":"method","reach":"private","type":"none","does":"Unregisters the stream the same way, then disposes the never-started real unit through the original."}],"sits":{"package":"none","assembly":"Denice.CrossPlatform.MacOS","namespace":"Denice.CrossPlatform.MacOS.Browser"},"relates":{"implements":"none","answers":"none","holds":["RedirectedStream","ProofMixer"]}}}},{"constant":{"id":"RedirectedStream","is":"element","value":{"form":"record","does":"Proposed. One Chromium output stream the redirection has taken over, with what the mixer needs to pull its samples.","reach":"internal","exactness":"loose","groups":{"concept":"audio","job":"none"},"members":[{"name":"Unit","kind":"property","reach":"internal","type":"none","does":"The real, never-started HAL output unit Chromium created."},{"name":"RenderCallback","kind":"property","reach":"internal","type":"none","does":"The render callback and its context that Chromium passed with kAudioUnitProperty_SetRenderCallback."},{"name":"Format","kind":"property","reach":"internal","type":"none","does":"The stream format Chromium set; anything other than 48 kHz float stereo fails the proof rather than being resampled."},{"name":"Device","kind":"property","reach":"internal","type":"none","does":"The output device Chromium selected, default or explicit, recorded so explicit-device streams can be told apart."},{"name":"State","kind":"property","reach":"internal","type":"none","does":"Where the stream is in its lifetime."}],"sits":{"package":"none","assembly":"Denice.CrossPlatform.MacOS","namespace":"Denice.CrossPlatform.MacOS.Browser"},"relates":{"implements":"none","answers":"none","holds":["StreamState"]}}}},{"constant":{"id":"StreamState","is":"element","value":{"form":"enum","does":"Proposed. The lifetime of one redirected stream; calls for units the proof did not create pass straight through.","reach":"internal","exactness":"loose","groups":{"concept":"audio","job":"none"},"members":[{"name":"Created","kind":"value","reach":"internal","type":"none","does":"The HAL output unit exists and is tracked."},{"name":"Configured","kind":"value","reach":"internal","type":"none","does":"Its render callback and format have been kept."},{"name":"Registered","kind":"value","reach":"internal","type":"none","does":"The mixer pulls it on every render cycle."},{"name":"Unregistered","kind":"value","reach":"internal","type":"none","does":"The mixer no longer calls it and no render cycle is inside it."},{"name":"Disposed","kind":"value","reach":"internal","type":"none","does":"The real unit has been disposed through the original."}],"sits":{"package":"none","assembly":"Denice.CrossPlatform.MacOS","namespace":"Denice.CrossPlatform.MacOS.Browser"},"relates":{"implements":"none","answers":"none","holds":"none"}}}},{"constant":{"id":"ProofMixer","is":"element","value":{"form":"class","does":"Proposed. Opens its own HAL output unit through DENICE's own AudioToolbox calls, which bypass the CEF image's redirected entries, pulls every registered stream and queued speech on its own clock, sums them at unity gain, plays the sum and gives the same sum to the diagnostic dump and the existing recorder.","reach":"internal","exactness":"loose","groups":{"concept":"audio","job":"owner"},"members":[{"name":"Start","kind":"method","reach":"internal","type":"none","does":"Starts the mixer's own output and returns only after its first render callback, before the browser is created."},{"name":"Register","kind":"method","reach":"internal","type":"none","does":"Adds a redirected stream to the snapshot the render callback reads."},{"name":"Unregister","kind":"method","reach":"internal","type":"none","does":"Swaps the stream out of the snapshot and waits a bounded number of render cycles until none can still be inside its callback, reporting an overrun as a proof failure."},{"name":"QueueSpeech","kind":"method","reach":"internal","type":"none","does":"Queues speech buffers converted once to the mixer format, with their word-range markers."},{"name":"Render","kind":"method","reach":"private","type":"none","does":"The mixer's own render callback. Calls each registered stream's callback with the mixer's timestamp and frame count, adds the speech queue, writes the sum to the device and copies it to the dump and recorder."},{"name":"Stop","kind":"method","reach":"internal","type":"none","does":"Stops the mixer's own output, only after CefRuntime.Shutdown has returned with no tracked stream left."}],"sits":{"package":"none","assembly":"Denice.CrossPlatform.MacOS","namespace":"Denice.CrossPlatform.MacOS.Browser"},"relates":{"implements":"none","answers":"none","holds":["RedirectedStream"]}}}},{"constant":{"id":"SpeechRedirectionProof","is":"element","value":{"form":"class","does":"Proposed. Replaces AVSpeechSynthesizer's speaking methods in DENICE's process so Chromium's page speech, a page reading text aloud, is rendered with writeUtterance:toBufferCallback:toMarkerCallback: into the proof mixer instead of the speaker, while Chromium's delegate still receives start, word-range and finish events.","reach":"internal","exactness":"loose","groups":{"concept":"audio","job":"service"},"members":[{"name":"Install","kind":"method","reach":"internal","type":"none","does":"Replaces the implementations of speakUtterance, stopSpeakingAtBoundary, pauseSpeakingAtBoundary, continueSpeaking and speaking, before CefRuntime.Initialize."},{"name":"SpeakUtterance","kind":"method","reach":"private","type":"none","does":"Renders the utterance through writeUtterance into the mixer's speech queue, calls the delegate's start event when the first buffer is queued, word-range events from markers, and finish after the last buffer is mixed."},{"name":"StopSpeaking","kind":"method","reach":"private","type":"none","does":"Cancels the utterance's remaining buffers in the mixer and reports the cancellation to the delegate."},{"name":"PauseSpeaking","kind":"method","reach":"private","type":"none","does":"Holds the mixer's speech queue at the next buffer boundary."},{"name":"ContinueSpeaking","kind":"method","reach":"private","type":"none","does":"Resumes the held speech queue."},{"name":"Speaking","kind":"property","reach":"private","type":"none","does":"Answers whether an utterance is still queued or playing in the mixer."}],"sits":{"package":"none","assembly":"Denice.CrossPlatform.MacOS","namespace":"Denice.CrossPlatform.MacOS.Browser"},"relates":{"implements":"none","answers":"none","holds":["ProofMixer"]}}}}]},"marks":{"marked":[],"missing":[]},"found":{"problems":[],"blockers":[],"pending":[]}}</script>
